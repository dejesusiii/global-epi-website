<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EPI Collect — GLOBAL EPI Field Collection</title>
<meta name="description" content="Offline field data collection for GLOBAL EPI LLC." />
<!-- A working tool, not a page to be found. Keep it out of search results. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#061A2E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
/* ── GLOBAL EPI palette, identical values to globalepillc.com ──────────
   Fonts are the system stack on purpose: a field app must start with no
   network, and a webfont host is a dependency that fails exactly where
   this tool is meant to work.                                          */
:root {
  --navy-900:#061A2E; --navy-800:#0A2540; --navy-700:#123A5C;
  --brand-500:#06BD95; --brand-600:#059B7B; --brand-700:#047963; --brand-400:#2FD3AF;
  --lime-500:#B4C908;
  --g-50:#F6F8F7; --g-100:#EDF1EF; --g-200:#DEE5E2; --g-300:#C5CFCB;
  --g-400:#87918D; --g-500:#69736F; --g-600:#4E5854; --g-700:#39413E; --g-800:#272D2B;
  --risk:#A8342C; --risk-bg:#FBEDEC; --warn:#8A6410; --warn-bg:#FBF3E2;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tap: 48px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--g-100); color: var(--g-700);
  font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand-600); outline-offset: 2px; border-radius: 6px; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ── App frame ─────────────────────────────────────────────────────── */
#app { min-height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; background: var(--g-50); box-shadow: 0 0 0 1px var(--g-200); }
.topbar {
  background: var(--navy-900); color: #fff; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20;
}
.topbar .mark { width: 28px; height: 28px; flex: none; }
.topbar h1 { font-size: .95rem; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; }
.topbar .sub { display:block; font-size:.68rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color: var(--brand-500); }
.netdot { display:flex; align-items:center; gap:6px; font-size:.7rem; color: var(--g-300); }
.netdot i { width:8px; height:8px; border-radius:50%; background: var(--g-400); display:block; }
.netdot.on i { background: var(--brand-500); }

main { flex: 1; padding: 18px 16px 96px; display: grid; gap: 18px; align-content: start; }
.screen { display: grid; gap: 18px; }
.screen[hidden] { display: none; }

/* ── Type ──────────────────────────────────────────────────────────── */
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; color: var(--navy-900); margin: 0; }
h3 { font-size: 1rem; font-weight: 700; color: var(--navy-900); margin: 0; }
p  { margin: 0; }
.muted { color: var(--g-500); font-size: .88rem; }
.eyebrow { font-size:.68rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color: var(--brand-700); }
.mono { font-family: var(--mono); font-size: .8rem; }

/* ── Cards, buttons ────────────────────────────────────────────────── */
.card { background:#fff; border:1px solid var(--g-200); border-radius:12px; padding:18px; display:grid; gap:12px; }
.btn {
  min-height: var(--tap); padding: 0 20px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; background: var(--brand-500); color: var(--navy-900); transition: background .12s;
}
.btn:active { background: var(--brand-400); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: #fff; border-color: var(--g-300); color: var(--navy-900); }
.btn.dark { background: var(--navy-900); color: #fff; }
.btn.danger { background:#fff; border-color: var(--risk); color: var(--risk); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .85rem; border-radius: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ── Form controls ─────────────────────────────────────────────────── */
.q { display: grid; gap: 8px; padding: 16px 0; border-top: 1px solid var(--g-200); }
.q:first-child { border-top: 0; padding-top: 4px; }
.q > label.lbl, .q > .lbl { font-weight: 600; color: var(--navy-900); line-height: 1.35; }
.q .req { color: var(--risk); margin-left: 3px; }
.q .hint { font-size: .84rem; color: var(--g-500); }
input[type=text], input[type=number], textarea, select {
  width: 100%; min-height: var(--tap); padding: 11px 13px; border-radius: 10px;
  border: 1.5px solid var(--g-300); background: #fff; color: var(--g-800);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { border-color: var(--brand-600); outline: none; box-shadow: 0 0 0 3px rgba(6,189,149,.18); }
.invalid input, .invalid textarea, .invalid select, .invalid .opts { border-color: var(--risk) !important; }
.err { font-size: .84rem; color: var(--risk); font-weight: 500; }
.counter { font-size:.78rem; color: var(--g-400); text-align: right; font-variant-numeric: tabular-nums; }

.opts { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; min-height: var(--tap);
  padding: 10px 14px; border: 1.5px solid var(--g-300); border-radius: 10px;
  background: #fff; cursor: pointer; line-height: 1.35;
}
.opt input { width: 22px; height: 22px; flex: none; accent-color: var(--brand-600); margin: 0; }
.opt.sel { border-color: var(--brand-600); background: #EAFBF6; }

.scale { display: grid; gap: 10px; }
.scale-row { display: grid; grid-auto-flow: column; gap: 8px; }
.scale-btn {
  min-height: 54px; border-radius: 10px; border: 1.5px solid var(--g-300); background: #fff;
  font-weight: 700; font-size: 1.05rem; color: var(--navy-900); cursor: pointer;
}
.scale-btn.sel { background: var(--brand-500); border-color: var(--brand-600); color: var(--navy-900); }
.scale-ends { display: flex; justify-content: space-between; font-size: .78rem; color: var(--g-500); }

/* ── Progress ──────────────────────────────────────────────────────── */
.progress { position: sticky; top: 52px; z-index: 15; background: var(--g-50); padding: 10px 0 12px; display:grid; gap:8px; }
.bar { height: 6px; border-radius: 99px; background: var(--g-200); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand-500); transition: width .25s; }
.steps { display: flex; justify-content: space-between; font-size: .76rem; color: var(--g-500); }

/* ── Bottom action bar ─────────────────────────────────────────────── */
.actionbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
  background: #fff; border-top: 1px solid var(--g-200);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; max-width: 720px; margin: 0 auto;
}
.actionbar .btn { flex: 1; }
.actionbar[hidden] { display: none; }

/* ── Lists ─────────────────────────────────────────────────────────── */
.list { display: grid; gap: 10px; }
.item {
  background:#fff; border:1px solid var(--g-200); border-radius:12px; padding:14px 16px;
  display:grid; gap:6px; text-align:left; width:100%; cursor:pointer; border-left:4px solid var(--g-300);
}
.item.pending  { border-left-color: var(--warn); }
.item.synced   { border-left-color: var(--brand-500); }
.item.conflict { border-left-color: var(--risk); }
.item-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.item-top strong { color: var(--navy-900); font-size:.95rem; }
.tag {
  font-size:.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 8px; border-radius:99px; border:1px solid var(--g-300); color: var(--g-500); white-space:nowrap;
}
.tag.pending  { color: var(--warn); border-color: var(--warn); }
.tag.synced   { color: var(--brand-700); border-color: var(--brand-600); }
.tag.conflict { color: var(--risk); border-color: var(--risk); }

.stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
.stat { background:#fff; border:1px solid var(--g-200); border-radius:12px; padding:14px; display:grid; gap:2px; }
.stat b { font-size:1.6rem; font-weight:700; color: var(--navy-900); font-variant-numeric: tabular-nums; line-height:1.1; }
.stat span { font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color: var(--g-500); }

/* ── Notices ───────────────────────────────────────────────────────── */
.notice { border-radius:10px; padding:14px 16px; font-size:.88rem; display:grid; gap:6px; border:1px solid var(--g-200); background:#fff; border-left:4px solid var(--brand-600); }
.notice.warn { background: var(--warn-bg); border-left-color: var(--warn); }
.notice.risk { background: var(--risk-bg); border-left-color: var(--risk); }
.notice b { color: var(--navy-900); }

.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(10px);
  background: var(--navy-900); color:#fff; padding: 12px 18px; border-radius: 10px;
  font-size:.88rem; font-weight:500; z-index: 40; opacity: 0; pointer-events:none;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align:center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

pre.dump {
  margin:0; padding:14px; border-radius:10px; background: var(--navy-900); color: var(--g-200);
  font-family: var(--mono); font-size:.72rem; line-height:1.6; overflow-x:auto; white-space:pre;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <svg class="mark" viewBox="0 0 27 29" aria-hidden="true">
      <circle cx="16" cy="18" r="10" fill="#B4C908" />
      <g fill="#A3A3A3">
        <circle cx="13" cy="15.5" r="3.8" /><circle cx="22" cy="23" r="3" />
        <circle cx="14.5" cy="3.5" r="2.5" /><circle cx="23.5" cy="11.5" r="2.5" />
        <circle cx="3" cy="14" r="2" /><circle cx="5" cy="2.5" r="1.8" />
      </g>
    </svg>
    <h1>EPI Collect<span class="sub">Global Epi · Field</span></h1>
    <span class="netdot" id="netdot" aria-live="polite"><i></i><span id="nettext">Offline</span></span>
  </header>

  <main>
    <!-- Screens are rendered by app.js -->
    <section class="screen" id="scr-unlock" hidden></section>
    <section class="screen" id="scr-home" hidden></section>
    <section class="screen" id="scr-form" hidden></section>
    <section class="screen" id="scr-queue" hidden></section>
    <section class="screen" id="scr-record" hidden></section>
    <section class="screen" id="scr-about" hidden></section>
  </main>

  <div class="actionbar" id="actionbar" hidden></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
